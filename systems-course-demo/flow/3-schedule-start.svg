th="2.2"/><text x="172.0" y="332.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">3. Move</text><text x="172.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#6b8085">robot fleet</text><path d="M172,364 L172,408" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="97.0" y="408" width="150" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="172.0" y="434.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">4. Check</text><text x="172.0" y="452.0" text-anchor="middle" font-size="11.5" fill="#6b8085">sensors</text><path d="M172,466 L172,510" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="190" y="492.0" font-size="12" fill="#1a3a3f">OK</text><rect x="97.0" y="510" width="150" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="172.0" y="536.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">6. Done</text><text x="172.0" y="554.0" text-anchor="middle" font-size="11.5" fill="#6b8085">room ready</text><rect x="302" y="408" width="125" height="58" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="364.5" y="434.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">5. Fix</text><text x="364.5" y="452.0" text-anchor="middle" font-size="11.5" fill="#6b8085">retry or ask a person</text><path d="M247.0,437.0 L302,437.0" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="274.5" y="423.0" text-anchor="middle" font-size="12" fill="#1a3a3f">problem</text><path d="M364.5,408 L364.5,335.0 L247.0,335.0" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="374.5" y="375.5" text-anchor="start" font-size="12" fill="#1a3a3f">try again</text></svg>