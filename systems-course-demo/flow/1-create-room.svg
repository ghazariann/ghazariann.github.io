<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 368" width="530" height="368" font-family='"Segoe UI", system-ui, sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a3a3f"/></marker></defs><rect x="6.0" y="12" width="128" height="50" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="70.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">Upload file</text><text x="70.0" y="52.0" text-anchor="middle" font-size="11.5" fill="#6b8085">.dwg  .3dm  .json</text><path d="M70.0,62 L70.0,86 L210,86 L210,102" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="146.0" y="12" width="128" height="50" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="210.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">Fill in a form</text><text x="210.0" y="52.0" text-anchor="middle" font-size="11.5" fill="#6b8085">or add your field</text><path d="M210.0,62 L210,102" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="286.0" y="12" width="128" height="50" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="350.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">Describe to AI</text><text x="350.0" y="52.0" text-anchor="middle" font-size="11.5" fill="#6b8085">plain words</text><path d="M350.0,62 L350.0,86 L210,86 L210,102" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="115.0" y="102" width="190" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="210.0" y="128.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">1. Room data</text><text x="210.0" y="146.0" text-anchor="middle" font-size="11.5" fill="#6b8085">size, grid, inventory</text><path d="M210,160 L210,198" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="115.0" y="198" width="190" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="210.0" y="224.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">2. Validate</text><text x="210.0" y="242.0" text-anchor="middle" font-size="11.5" fill="#6b8085">rules and grid</text><path d="M210,256 L210,294" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="218" y="279.0" font-size="12" fill="#1a3a3f">OK</text><rect x="115.0" y="294" width="190" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="210.0" y="320.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">4. Done</text><text x="210.0" y="338.0" text-anchor="middle" font-size="11.5" fill="#6b8085">room created</text><rect x="365" y="198" width="150" height="58" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="440.0" y="224.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">3. Fix</text><text x="440.0" y="242.0" text-anchor="middle" font-size="11.5" fill="#6b8085">edit a field or ask AI</text><path d="M305.0,227.0 L365,227.0" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="335.0" y="221.0" text-anchor="middle" font-size="12" fill="#1a3a3f">problem</text><path d="M440.0,198 L440.0,131.0 L305.0,131.0" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="434.0" y="164.5" text-anchor="end" font-size="12" fill="#1a3a3f">try again</text></svg>