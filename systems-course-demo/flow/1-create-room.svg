<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 437 380" width="437" height="380" font-family='"Segoe UI", system-ui, sans-serif'><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a3a3f"/></marker></defs><rect x="2.0" y="12" width="96" height="50" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="50.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">Upload file</text><text x="50.0" y="52.0" text-anchor="middle" font-size="11.5" fill="#6b8085">.dwg  .3dm  .json</text><path d="M50.0,62 L50.0,86 L172,86 L172,102" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="106.0" y="12" width="104" height="50" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="158.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">Fill in a form</text><text x="158.0" y="52.0" text-anchor="middle" font-size="11.5" fill="#6b8085">add your field</text><path d="M158.0,62 L158.0,86 L172,86 L172,102" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="218.0" y="12" width="124" height="50" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="280.0" y="34.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">Describe to AI</text><text x="280.0" y="52.0" text-anchor="middle" font-size="11.5" fill="#6b8085">plain words</text><path d="M280.0,62 L280.0,86 L172,86 L172,102" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="97.0" y="102" width="150" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="172.0" y="128.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">1. Room data</text><text x="172.0" y="146.0" text-anchor="middle" font-size="11.5" fill="#6b8085">size, grid, inventory</text><path d="M172,160 L172,204" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><rect x="97.0" y="204" width="150" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="172.0" y="230.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">2. Validate</text><text x="172.0" y="248.0" text-anchor="middle" font-size="11.5" fill="#6b8085">rules and grid</text><path d="M172,262 L172,306" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="190" y="288.0" font-size="12" fill="#1a3a3f">OK</text><rect x="97.0" y="306" width="150" height="58" rx="11" fill="#fff" stroke="#1a3a3f" stroke-width="2.2"/><text x="172.0" y="332.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">4. Done</text><text x="172.0" y="350.0" text-anchor="middle" font-size="11.5" fill="#6b8085">room created</text><rect x="302" y="204" width="125" height="58" rx="11" fill="#eceae2" stroke="#1a3a3f" stroke-width="1.6"/><text x="364.5" y="230.0" text-anchor="middle" font-size="16" font-weight="700" fill="#1a3a3f">3. Fix</text><text x="364.5" y="248.0" text-anchor="middle" font-size="11.5" fill="#6b8085">edit a field or ask AI</text><path d="M247.0,233.0 L302,233.0" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="274.5" y="219.0" text-anchor="middle" font-size="12" fill="#1a3a3f">problem</text><path d="M364.5,204 L364.5,131.0 L247.0,131.0" fill="none" stroke="#1a3a3f" stroke-width="2.2" marker-end="url(#ah)"/><text x="374.5" y="171.5" text-anchor="start" font-size="12" fill="#1a3a3f">try again</text></svg>