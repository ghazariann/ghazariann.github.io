<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>ReRoom flowcharts</title>
<style>
 body { margin:0; padding:28px; background:#f6f4ee; color:#1a3a3f; font:15px "Segoe UI", system-ui, sans-serif; }
 h1 { margin:0 0 20px; }
 .row { display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start; }
 figure { margin:0; background:#fff; border:1px solid #d9d5c9; border-radius:14px; padding:14px 14px 6px; }
 figcaption { font-weight:700; margin-bottom:8px; }
 img { width:380px; display:block; }
</style></head><body>
<h1>ReRoom flowcharts</h1>
<div class="row">
 <figure><figcaption>1. Create room</figcaption><img src="flow/1-create-room.svg" alt="Create room flow"></figure>
 <figure><figcaption>2. Create layouts</figcaption><img src="flow/2-create-layouts.svg" alt="Create layouts flow"></figure>
 <figure><figcaption>3. Schedule or start</figcaption><img src="flow/3-schedule-start.svg" alt="Schedule or start flow"></figure>
</div></body></html>
